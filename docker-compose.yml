version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instaapp
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - instaapp-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: instaapp-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - instaapp-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: instaapp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: instaapp
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: instaapp
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - instaapp-network

  redis:
    image: redis:alpine
    container_name: instaapp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - instaapp-network

  node:
    image: node:22-alpine
    container_name: instaapp-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    networks:
      - instaapp-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

networks:
  instaapp-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
